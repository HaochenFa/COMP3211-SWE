# tmux settings for the recorded demo (demo.tape). The status line is the
# caption bar; the tape rewrites status-left before each step while VHS
# is hidden. Nothing here is part of the PIM itself.
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -g status on
set -g status-position bottom
set -g status-interval 0
set -g status-justify left
set -g status-style "bg=#fde68a,fg=#1c1917,bold"
set -g status-left-length 200
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
set -g status-left " COMP3211 PIM "
