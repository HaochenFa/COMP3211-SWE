# tmux settings for the recorded demo (demo.tape). The status line is a
# step marker, not a caption: the tape flips its colour between green and
# magenta at each step while VHS is hidden, render.py finds those flips to
# time the captions, then crops the status line out of the final video.
# Nothing here is part of the PIM itself.
set -g escape-time 0
set -g default-terminal "tmux-256color"
set -g status 2
set -g status-position bottom
set -g status-interval 0
set -g status-justify left
set -g status-style "bg=#00ff00"
# Line 0 is a blank spacer in the VHS background colour, so render.py can
# crop inside it without touching the PIM's last row or the marker's colour.
set -g status-format[0] "#[bg=#171717,fill=#171717] "
set -g status-format[1] " "
set -g status-left " "
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
